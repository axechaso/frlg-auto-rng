name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-auto.txt
            requirements-pyside-preview.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-auto.txt -r requirements-pyside-preview.txt

      - name: Compile Python sources
        run: >-
          python -m py_compile
          app_paths.py
          save_profiles.py
          tid_records.py
          tid_session.py
          process_control.py
          pyside_preview.py
          run_auto_rng_gui.py
          run_auto_planner.py
          run_easycon_logged.py
          run_sid_reverse.py
          run_sid_reverse_capture.py
          run_sid_traversal.py
          run_tid_starter_flow.py
          app_version.py
          app_updater.py
          update_installer.py
          updater_entry.py
          package_entry.py
          tools/create_update_manifest.py
          sid_traversal.py
          tenlines_seed_updater.py
          automation/easycon118.py
          automation/precalibration.py
          automation/seed_common_regions.py
          automation/script_test.py
          automation/sid_reverse118.py
          automation/tid_rng137.py
          automation/tid_calibration.py
          automation/tid_checkpoint.py
          automation/tid_search.py
          automation/tid_search_policy.py
          automation/tid_logging.py
          automation/tid_starter_save.py
          automation/tid_starter_flow.py
          rng/sid_reverse.py
          rng/sid_reverse_workflow.py
          rng/starter_sid_verification.py
          rng/tenlines_utils.py

      - name: Run repository-independent unit tests
        run: >-
          python -m unittest -v
          tests.test_auto_planner.PlannerSelectionTests
          tests.test_easycon118_egg
          tests.test_easycon164a_backend
          tests.test_easycon_logged
          tests.test_gui_inputs
          tests.test_home_buffer_recovery
          tests.test_label_matcher
          tests.test_manual_tools
          tests.test_pyside_preview
          tests.test_sid_reverse
          tests.test_sid_reverse118
          tests.test_sid_reverse_capture
          tests.test_sid_reverse_workflow
          tests.test_starter_sid_verification
          tests.test_script_test
          tests.test_save_profiles
          tests.test_seed_table_updater
          tests.test_seed_common_regions
          tests.test_tenlines_fixes
          tests.test_tid_rng137
          tests.test_tid_calibration
          tests.test_tid_records
          tests.test_tid_session
          tests.test_tid_search
          tests.test_tid_search_policy
          tests.test_tid_logging
          tests.test_process_control
          tests.test_precalibration
          tests.test_sid_traversal
          tests.test_tid_starter_save
          tests.test_tid_starter_flow
          tests.test_tid_starter_runner
          tests.test_app_version
          tests.test_package_entry
          tests.test_app_updater
          tests.test_update_installer
          tests.test_update_manifest_tool
