name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-auto.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-auto.txt

      - name: Compile Python sources
        run: >-
          python -m py_compile
          run_auto_rng_gui.py
          run_auto_planner.py
          automation/easycon118.py
          automation/tid_rng137.py
          rng/tenlines_utils.py

      - name: Run repository-independent unit tests
        run: >-
          python -m unittest -v
          tests.test_auto_planner.PlannerSelectionTests
          tests.test_easycon118_egg
          tests.test_easycon164a_backend
          tests.test_gui_inputs
          tests.test_label_matcher
          tests.test_tenlines_fixes
