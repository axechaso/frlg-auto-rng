  input-protocol:
    name: Production C# input protocol / .NET 9
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install protocol client dependencies
        run: python -m pip install -r requirements-pyside6.txt -r requirements-pyside-preview.txt
      - name: Link production patched state source and real enums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/EasyConNS/EasyCon.git .build/protocol-source
          if ($LASTEXITCODE -ne 0) { throw 'clone failed' }
          git -C .build/protocol-source checkout --detach 9c86137c7e63bff842175470895727a5fa9bab52
          if ($LASTEXITCODE -ne 0) { throw 'pinned checkout failed' }
          $patchRoot = (Resolve-Path tools/patches).Path
          git -C .build/protocol-source apply --include=src/EasyCon.Device/InputStateBuffer.cs "$patchRoot/easycon164a-input-state-v1.patch"
          if ($LASTEXITCODE -ne 0) { throw 'production state patch failed' }
          git -C .build/protocol-source apply "$patchRoot/easycon164a-input-state-json-v2.patch"
          if ($LASTEXITCODE -ne 0) { throw 'numeric arrays patch failed' }
          New-Item -ItemType Directory -Path .tmp -Force | Out-Null
          $protocolSource = (Resolve-Path .build/protocol-source).Path
          dotnet run --project tools/EasyConInputStateProtocolCheck -p:EasyConSource="$protocolSource" -- .tmp/production-state.json
          if ($LASTEXITCODE -ne 0) { throw 'production serialization failed' }
          python tools/verify_easycon_protocol.py --samples .tmp/production-state.json
          if ($LASTEXITCODE -ne 0) { throw 'production parser rejected samples' }
      - uses: actions/upload-artifact@v4
        with:
          name: production-input-state-protocol
          path: .tmp/production-state.json
